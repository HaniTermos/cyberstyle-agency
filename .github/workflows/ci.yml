name: CYBERSTYLE CI / Quality Gate & E2E Testing

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Typecheck, Security Unit Tests & Production Build
  # ----------------------------------------------------------------------------
  validate:
    name: Schema, Types, Security Tests & Builds
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cyberstyle_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Typecheck Monorepo
        run: |
          npx --workspace=@cyberstyle/api tsc --noEmit
          npx --workspace=@cyberstyle/web tsc --noEmit

      - name: Run Backend Security & Integration Test Suites
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "ci_test_secret_key_minimum_32_bytes_long_here!"
          SESSION_SECRET: "ci_test_session_secret_minimum_32_bytes_long!"
        run: |
          npx prisma db push
          npm run test:tenant --workspace=@cyberstyle/api
          npm run test:portal --workspace=@cyberstyle/api
          npm run test:phase3 --workspace=@cyberstyle/api
          npm run test:restore --workspace=@cyberstyle/api
          npm run test:e2e --workspace=@cyberstyle/api

      - name: Production Builds
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          AUTH_SECRET: "ci_test_secret_key_minimum_32_bytes_long_here!"
          SESSION_SECRET: "ci_test_session_secret_minimum_32_bytes_long!"
        run: |
          npm run build --workspace=@cyberstyle/api
          npm run build --workspace=@cyberstyle/web

  # ----------------------------------------------------------------------------
  # 2. Playwright End-to-End (E2E) Browser Testing
  # ----------------------------------------------------------------------------
  playwright-e2e:
    name: Playwright End-to-End Browser Tests
    runs-on: ubuntu-latest
    needs: [validate]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cyberstyle_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database & Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
        run: |
          npx prisma generate
          npx prisma db push
          node prisma/safe_reset_and_bootstrap.js

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        run: npm run build --workspace=@cyberstyle/web

      - name: Start API Server in Background
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "ci_test_secret_key_minimum_32_bytes_long_here!"
          SESSION_SECRET: "ci_test_session_secret_minimum_32_bytes_long!"
          PORT: 4000
        run: |
          nohup npm run dev:direct --workspace=@cyberstyle/api > api.log 2>&1 &
          sleep 4

      - name: Start Web Server in Background
        env:
          PORT: 3000
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        run: |
          nohup npm run start --workspace=@cyberstyle/web > web.log 2>&1 &
          sleep 4

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
        run: npx --workspace=@cyberstyle/web playwright test

      - name: Upload Playwright Test Results / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 3. Docker Image Build Verification
  # ----------------------------------------------------------------------------
  docker-check:
    name: Dockerfile Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cyberstyle-api:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: cyberstyle-web:test
