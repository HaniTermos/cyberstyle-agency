name: CYBERSTYLE CI / Quality Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Schema, Types & Lint Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cyberstyle_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Typecheck Monorepo
        run: npm run lint

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "test_secret_for_ci_environment_validation_only"
          SESSION_SECRET: "test_session_secret_for_ci_environment_validation_only"
        run: npm run test --if-present
