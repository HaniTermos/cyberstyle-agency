name: CYBERSTYLE CI / Quality Gate & E2E Testing

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ----------------------------------------------------------------------------
  # 1. Typecheck, OWASP Top 10 Security Tests & Production Build
  # ----------------------------------------------------------------------------
  validate:
    name: Schema, Types, OWASP Security Tests & Builds
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cyberstyle_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint & Typecheck Monorepo
        run: npm run ci:typecheck

      - name: Deploy Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
        run: |
          npx prisma migrate deploy || npx prisma db push --skip-generate

      - name: Run Backend Security & Tenant Isolation Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci_test_auth_secret_minimum_32_characters_long_for_security_tests_12345' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci_test_session_secret_minimum_32_characters_long_for_security_tests_12345' }}
        run: npm run ci:test

      - name: Run OWASP Top 10 Compliance Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci_test_auth_secret_minimum_32_characters_long_for_security_tests_12345' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci_test_session_secret_minimum_32_characters_long_for_security_tests_12345' }}
        run: npm run test:owasp --workspace=@cyberstyle/api

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Production Builds
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci_test_auth_secret_minimum_32_characters_long_for_security_tests_12345' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci_test_session_secret_minimum_32_characters_long_for_security_tests_12345' }}
        run: npm run ci:build

  # ----------------------------------------------------------------------------
  # 2. Playwright End-to-End (E2E) Browser Testing
  # ----------------------------------------------------------------------------
  playwright-e2e:
    name: Playwright End-to-End Browser Tests
    runs-on: ubuntu-latest
    needs: [validate]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cyberstyle_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Database & Seed Initial Content
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push --skip-generate
          node prisma/safe_reset_and_bootstrap.js
          node prisma/seed_faqs.js
          node prisma/seed_reviews.js
          node prisma/seed_admin.js

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        run: npm run build --workspace=@cyberstyle/web

      - name: Start API Server in Background
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/cyberstyle_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci_test_auth_secret_minimum_32_characters_long_for_security_tests_12345' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci_test_session_secret_minimum_32_characters_long_for_security_tests_12345' }}
          PORT: 4000
        run: |
          nohup npm run dev:direct --workspace=@cyberstyle/api > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/api/health > /dev/null; then
              echo "✅ API Server is online and healthy."
              break
            fi
            sleep 1
          done

      - name: Start Web Server in Background
        env:
          PORT: 3000
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        run: |
          nohup npm run start --workspace=@cyberstyle/web > web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Web Server is online and ready."
              break
            fi
            sleep 1
          done

      - name: Dump Server Logs if Startup Timed Out
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat api.log || true
          echo "=== WEB LOG ==="
          cat web.log || true

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
        run: npx --workspace=@cyberstyle/web playwright test

      - name: Upload Playwright Test Results / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 3. Production Docker Image Build Verification
  # ----------------------------------------------------------------------------
  docker-check:
    name: Production Dockerfile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: false
          tags: cyberstyle-api:prod-ci

      - name: Build Web Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: false
          tags: cyberstyle-web:prod-ci
