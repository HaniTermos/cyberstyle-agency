version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Next.js Web Frontend & Portal
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cyberstyle_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://cyberstyle.net
      NEXT_PUBLIC_API_URL: https://cyberstyle.net/api
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.agency-web.rule=Host(`${DOMAIN:-cyberstyle.net}`, `www.${DOMAIN:-cyberstyle.net}`)"
      - "traefik.http.routers.agency-web.entrypoints=web,websecure"
      - "traefik.http.routers.agency-web.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.agency-web.priority=10"
      - "traefik.http.services.agency-web.loadbalancer.server.port=3000"
    depends_on:
      - api

  # ----------------------------------------------------------------------------
  # Express.js REST API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cyberstyle_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.agency-api.rule=(Host(`${DOMAIN:-cyberstyle.net}`, `www.${DOMAIN:-cyberstyle.net}`) && PathPrefix(`/api`)) || Host(`api.${DOMAIN:-cyberstyle.net}`)"
      - "traefik.http.routers.agency-api.entrypoints=web,websecure"
      - "traefik.http.routers.agency-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.agency-api.priority=100"
      - "traefik.http.services.agency-api.loadbalancer.server.port=4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # BullMQ Asynchronous Queue Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cyberstyle_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    networks:
      - cyberstyle_network
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberstyle_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cyberstyle_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cyberstyle_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberstyle_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Alternative fallback if not using Traefik)
  # ----------------------------------------------------------------------------
  nginx:
    profiles:
      - nginx
    image: nginx:alpine
    container_name: cyberstyle_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - cyberstyle_network
    depends_on:
      - web
      - api

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  cyberstyle_network:
    driver: bridge
  proxy:
    external: true
