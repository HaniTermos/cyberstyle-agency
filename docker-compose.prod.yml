name: cyberstyle_prod

services:
  # ----------------------------------------------------------------------------
  # Next.js Web Frontend & Portal (Production Standalone)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: cyberstyle_web_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000/api
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cyberstyle.net}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cyberstyle.net/api}
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.agency-web.rule=Host(`${DOMAIN:-cyberstyle.net}`, `www.${DOMAIN:-cyberstyle.net}`)"
      - "traefik.http.routers.agency-web.entrypoints=web,websecure"
      - "traefik.http.routers.agency-web.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.agency-web.priority=10"
      - "traefik.http.services.agency-web.loadbalancer.server.port=3000"
    depends_on:
      api:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Express.js REST API (Production Compiled)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: cyberstyle_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:-https://cyberstyle.net/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cyberstyle.net}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456789}@postgres:5432/${POSTGRES_DB:-db_agency_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET:-jwt_production_secret_key_change_me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,https://cyberstyle.net}
    ports:
      - "127.0.0.1:${PROD_API_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.agency-api.rule=(Host(`${DOMAIN:-cyberstyle.net}`, `www.${DOMAIN:-cyberstyle.net}`) && PathPrefix(`/api`)) || Host(`api.${DOMAIN:-cyberstyle.net}`)"
      - "traefik.http.routers.agency-api.entrypoints=web,websecure"
      - "traefik.http.routers.agency-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.agency-api.priority=100"
      - "traefik.http.services.agency-api.loadbalancer.server.port=4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # BullMQ Asynchronous Queue Worker (Production Compiled)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: cyberstyle_worker_prod
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456789}@postgres:5432/${POSTGRES_DB:-db_agency_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
    networks:
      - cyberstyle_network
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Production)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberstyle_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-db_agency_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PROD_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_agency_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # Redis 7 (Production)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberstyle_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_data_prod:/data
    ports:
      - "127.0.0.1:${PROD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Alternative fallback if not using Traefik)
  # ----------------------------------------------------------------------------
  nginx:
    profiles:
      - nginx
    image: nginx:alpine
    container_name: cyberstyle_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - cyberstyle_network
    depends_on:
      - web
      - api

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  cyberstyle_network:
    driver: bridge
  proxy:
    external: true
