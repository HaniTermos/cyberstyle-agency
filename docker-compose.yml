services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberstyle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-db_agency}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_agency}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Caching, Rate Limiting, BullMQ Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberstyle_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberstyle_network

  # ----------------------------------------------------------------------------
  # 3. Express.js REST API Backend
  # ----------------------------------------------------------------------------
  api:
    image: agencyproject-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cyberstyle_api_server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456789}@postgres:5432/${POSTGRES_DB:-db_agency}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-admin@cyberstyle.net}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cyberstyle-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.cyberstyle-api.entrypoints=web"
      - "traefik.http.routers.cyberstyle-api.priority=100"
      - "traefik.http.services.cyberstyle-api.loadbalancer.server.port=4000"

  # ----------------------------------------------------------------------------
  # 4. Next.js App Router Web Frontend & Portal
  # ----------------------------------------------------------------------------
  web:
    image: agencyproject-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cyberstyle_web_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000/api}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cyberstyle_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cyberstyle-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.cyberstyle-web.entrypoints=web"
      - "traefik.http.routers.cyberstyle-web.priority=10"
      - "traefik.http.services.cyberstyle-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  root_node_modules:
    driver: local
  api_node_modules:
    driver: local
  web_node_modules:
    driver: local

networks:
  cyberstyle_network:
    driver: bridge
  proxy:
    external: true
